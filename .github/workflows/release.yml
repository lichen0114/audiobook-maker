name: Release desktop app

# Build the self-contained macOS app and attach the .dmg to a GitHub Release
# whenever a v* tag is pushed (e.g. `git tag v0.1.0 && git push --tags`).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write # needed to create the Release and upload assets

jobs:
  package:
    runs-on: macos-15 # Apple Silicon runner (arm64)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the Native SDK CLI
        run: npm install -g @native-sdk/cli@0.4.0

      - name: Install espeak-ng (bundled, relocated by the packager)
        run: brew install espeak-ng

      - name: Test native state, views, and markup
        working-directory: desktop
        run: |
          native test --yes
          native check

      - name: Build AudiobookMaker.app + .dmg
        run: ./desktop/packaging/package.sh
        env:
          VERSION: ${{ github.ref_name }}

      - name: Smoke test the bundled runtime outside the checkout
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          resources = Path('desktop/dist/AudiobookMaker.app/Contents/Resources').resolve()
          python = resources / 'python/bin/python3'
          backend = resources / 'backend/app.py'
          sample = Path('tests/fixtures/sample.epub').resolve()
          env = dict(os.environ)
          env['PATH'] = str(resources) + os.pathsep + env.get('PATH', '')
          env['DYLD_LIBRARY_PATH'] = str(resources)
          with tempfile.TemporaryDirectory() as work:
              for output_format in ('mp3', 'm4b'):
                  output = Path(work) / ('smoke.' + output_format)
                  command = [str(python), str(backend), '--input', str(sample),
                             '--output', str(output), '--backend', 'mock',
                             '--format', output_format, '--checkpoint',
                             '--event_format', 'json', '--no_rich']
                  inspection = subprocess.run(command + ['--inspect_job'], env=env,
                                              cwd=work, text=True, capture_output=True,
                                              check=True, timeout=60)
                  event = next(json.loads(line) for line in inspection.stdout.splitlines()
                               if json.loads(line).get('type') == 'inspection')
                  assert event['result']['chapter_count'] > 0
                  assert event['result']['sections']
                  subprocess.run(command, env=env, cwd=work, check=True, timeout=120)
                  assert output.stat().st_size > 0
                  assert not Path(str(output) + '.checkpoint').exists()
                  subprocess.run([str(resources / 'ffmpeg'), '-v', 'error', '-i',
                                  str(output), '-f', 'null', '-'], env=env, cwd=work,
                                 check=True, timeout=60)
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudiobookMaker-dmg
          path: desktop/dist/AudiobookMaker.dmg

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/AudiobookMaker.dmg
          body: |
            ## Audiobook Maker ${{ github.ref_name }} (macOS, Apple Silicon)

            Download **AudiobookMaker.dmg**, open it, and drag the app to Applications.

            Unsigned build — on first open, **right-click the app → Open** (or run
            `xattr -dr com.apple.quarantine "/Applications/AudiobookMaker.app"`).
            The first conversion downloads the ~330 MB voice model.
