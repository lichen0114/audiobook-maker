name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  pr-tests:
    name: Python + CLI (fast)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      - name: Install CLI dependencies
        run: npm ci --prefix cli

      - name: Run Python tests (not slow)
        run: .venv/bin/python -m pytest -m "not slow" --cov-reset --cov=audiobook_backend --cov=checkpoint --cov-report=term-missing --cov-fail-under=75

      - name: Run CLI tests
        run: npm test --prefix cli

      - name: Run CLI coverage
        run: npm run test:coverage --prefix cli

  native-tests:
    name: macOS native UI
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the pinned Native SDK CLI
        run: npm install -g @native-sdk/cli@0.4.0
      - name: Run native state and view tests
        working-directory: desktop
        run: native test --yes
      - name: Validate markup against the built model contract
        working-directory: desktop
        run: native check

  slow-tests:
    name: Python slow tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      - name: Run slow Python tests
        run: .venv/bin/python -m pytest -m slow
